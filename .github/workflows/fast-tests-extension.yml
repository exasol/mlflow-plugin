name: Fast-Tests-Extension

on:
  workflow_call:

jobs:
  get-matrix:
    name: Get Minimum Python Version
    uses: $/.github/workflows/matrix.yml
    with:
      matrix_keys_json: '["minimum_python_version"]'
    permissions:
      contents: read

  generated-files:
    name: Generated Files
    needs: get-matrix
    strategy:
      matrix:
        python_version: ${{ fromJSON(needs.get-matrix.outputs.matrix).minimum_python_version }}
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read
    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python & Poetry Environment
        id: set-up-python-and-poetry-environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v12
        with:
          python-version: ${{ matrix.python_version }}
          poetry-version: "2.3.0"

      - name: Check Outdated
        id: check-outdated
        run: poetry run -- nox -s generated-files:check-outdated
